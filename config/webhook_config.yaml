# XC-ROBOT Webhook 自动通知配置
# 支持关键词触发的webhook消息发送

webhook:
  # Webhook基础配置
  enabled: true
  url: "https://open.feishu.cn/open-apis/bot/v2/hook/dcd482ef-8259-461e-845e-702571abbd9c"  # 您的飞书webhook URL
  timeout: 30
  retry_count: 3
  
  # 关键词配置 - 在webhook机器人中设置统一关键词 "infobot"
  keyword: "infobot"                  # 统一关键词
    
  # 消息格式配置
  message_format:
    timestamp_format: "%m-%d %H:%M"
    include_hostname: false
    include_project_name: false
    max_message_length: 200

# 监控配置
monitoring:
  # 文件监控设置
  file_watch:
    enabled: true
    patterns: ["*.py", "*.js", "*.html", "*.css", "*.md"]
    exclude_dirs: ["__pycache__", ".git", "node_modules", "venv"]
    debounce_seconds: 2  # 防抖动时间
    
  # 调试监控设置  
  debug_watch:
    enabled: true
    success_patterns:
      - "Test passed"
      - "SUCCESS"
      - "✓"
      - "完成"
      - "成功"
    log_files: ["logs/*.log", "testing/logs/*.json"]
    
  # Git监控设置
  git_watch:
    enabled: true
    hook_types: ["post-commit", "pre-push"]

# 通知内容模板
templates:
  file_created:
    keyword: "infobot"
    title: ""
    format: |
      infobot 📄创建文件：{filename}
      工作内容：{description}。新建文件完成相关功能开发，包含核心业务逻辑实现，为项目增加了新的功能模块和代码结构。
      完成时间：{timestamp}
      
  file_modified:
    keyword: "infobot"  
    title: ""
    format: |
      infobot ✏️修改文件：{filename}
      工作内容：{changes}。对现有代码进行优化改进，修复了相关问题并增强了功能性能，确保代码质量和系统稳定性得到提升。
      完成时间：{timestamp}
      
  debug_success:
    keyword: "infobot"
    title: ""
    format: |
      infobot ✅调试完成：{debug_info}
      工作内容：系统调试测试成功完成，验证了核心功能的正确性和稳定性。通过全面的测试流程，确保了代码质量达到预期标准，系统运行状态良好。
      测试结果：{result} | 完成时间：{timestamp}
      
  commit_event:
    keyword: "infobot"
    title: ""
    format: |
      infobot 📦代码提交：{commit_message}
      工作内容：完成了重要的代码开发和优化工作，涉及{file_count}个文件的修改。本次提交包含功能增强、问题修复或新特性开发，为项目持续改进做出贡献。
      提交信息：作者{author} | 完成时间：{timestamp}
      
  test_complete:
    keyword: "infobot"
    title: ""
    format: |
      infobot 🧪测试完成：{test_type}
      工作内容：执行了全面的系统测试，验证了各项功能模块的正确性和稳定性。测试过程涵盖核心业务逻辑、异常处理和性能指标，确保系统质量达标。
      测试结果：{result} | 完成时间：{timestamp}
      
  error_alert:
    keyword: "infobot"
    title: ""
    format: |
      infobot ⚠️错误警告：{error_type}
      问题详情：{error_details}。检测到系统运行异常，需要及时关注和处理。建议检查相关日志文件和系统状态，确保问题得到快速解决。
      发生时间：{timestamp}