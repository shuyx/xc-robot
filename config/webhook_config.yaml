# XC-ROBOT Webhook 自动通知配置
# 支持关键词触发的webhook消息发送

webhook:
  # Webhook基础配置
  enabled: true
  url: "https://open.feishu.cn/open-apis/bot/v2/hook/dcd482ef-8259-461e-845e-702571abbd9c"  # 您的飞书webhook URL
  timeout: 30
  retry_count: 3
  
  # 关键词配置 - 在webhook机器人中设置统一关键词 "infobot"
  keyword: "infobot"                  # 统一关键词
    
  # 消息格式配置
  message_format:
    timestamp_format: "%m-%d %H:%M"
    include_hostname: false
    include_project_name: false
    max_message_length: 100

# 监控配置
monitoring:
  # 文件监控设置
  file_watch:
    enabled: true
    patterns: ["*.py", "*.js", "*.html", "*.css", "*.md"]
    exclude_dirs: ["__pycache__", ".git", "node_modules", "venv"]
    debounce_seconds: 2  # 防抖动时间
    
  # 调试监控设置  
  debug_watch:
    enabled: true
    success_patterns:
      - "Test passed"
      - "SUCCESS"
      - "✓"
      - "完成"
      - "成功"
    log_files: ["logs/*.log", "testing/logs/*.json"]
    
  # Git监控设置
  git_watch:
    enabled: true
    hook_types: ["post-commit", "pre-push"]

# 通知内容模板
templates:
  file_created:
    keyword: "infobot"
    title: ""
    format: |
      infobot 📄创建文件 {filename} | {description} | {timestamp}
      
  file_modified:
    keyword: "infobot"  
    title: ""
    format: |
      infobot ✏️修改文件 {filename} | {changes} | {timestamp}
      
  debug_success:
    keyword: "infobot"
    title: ""
    format: |
      infobot ✅调试成功 {debug_info} | 结果:{result} | {timestamp}
      
  commit_event:
    keyword: "infobot"
    title: ""
    format: |
      infobot 📦提交代码 {commit_message} | 文件数:{file_count} | 作者:{author} | {timestamp}
      
  test_complete:
    keyword: "infobot"
    title: ""
    format: |
      infobot 🧪测试完成 {test_type} | 结果:{result} | {timestamp}
      
  error_alert:
    keyword: "infobot"
    title: ""
    format: |
      infobot ⚠️错误警告 {error_type} | {error_details} | {timestamp}