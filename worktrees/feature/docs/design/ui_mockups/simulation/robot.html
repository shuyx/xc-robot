    <style>
        .card {

<body class="font-sans bg-gray-50 text-secondary">
    <div id="robot-simulation" class="w-full h-[calc(100vh-100px)] p-4">
        <!-- Page Header -->
        <div class="mb-4">
            <h1 class="text-2xl font-bold text-secondary">机器人仿真系统</h1>

            <!-- Left Column: 3D View + Target Setup -->

                    <div class="card-body p-0 relative h-[calc(100%-4rem)]">

                                <button class="bg-gray-200 hover:bg-gray-300 text-secondary px-3 py-1 rounded text-xs">

                                </button>
                                <button class="bg-gray-200 hover:bg-gray-300 text-secondary px-3 py-1 rounded text-xs">
                                    <i class="fa-solid fa-arrows-up-down-left-right mr-1"></i>平移
                                </button>
                                <button class="bg-gray-200 hover:bg-gray-300 text-secondary px-3 py-1 rounded text-xs">
                                    <i class="fa-solid fa-arrow-down mr-1"></i>俯视
                                </button>
                                <button class="bg-gray-200 hover:bg-gray-300 text-secondary px-3 py-1 rounded text-xs">
                                    <i class="fa-solid fa-arrow-right mr-1"></i>侧视
                                </button>

                        </div>
                    </div>
                </div>
                
                <!-- Target Setup -->
                <div id="target-setup" class="card h-[18%]">
                    <div class="card-header">
                        <div class="flex items-center">
                            <i class="fa-solid fa-bullseye text-warning mr-2"></i>
                            <h2 class="text-lg font-semibold">目标设置</h2>
                        </div>
                    </div>
                    <div class="card-body grid grid-cols-2 gap-4">
                        <div>
                            <div class="mb-2 text-sm font-medium">🎯 目标位置 (mm):</div>
                            <div class="grid grid-cols-3 gap-2">
                                <div>
                                    <label class="text-xs text-gray-600">X:</label>
                                    <input type="number" value="400" class="input-control">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-600">Y:</label>
                                    <input type="number" value="0" class="input-control">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-600">Z:</label>

                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="mb-2 text-sm font-medium">📐 目标姿态 (度):</div>

                                <div>
                                    <label class="text-xs text-gray-600">RX:</label>

                                </div>
                                <div>
                                    <label class="text-xs text-gray-600">RY:</label>
                                    <input type="number" value="0" class="input-control">
                                </div>
                                <div>

                            </div>

                    </div>

                    </div>
                </div>
                
                <!-- Simulation Monitoring -->
                <div id="simulation-monitoring" class="card h-[22%]">
                    <div class="card-header">
                        <div class="flex items-center">
                            <i class="fa-solid fa-chart-line text-primary mr-2"></i>
                            <h2 class="text-lg font-semibold">仿真监控</h2>
                        </div>
                    </div>
                    <div class="card-body grid grid-cols-2 gap-4">
                        <div>
                            <div class="mb-1 flex items-center">
                                <i class="fa-regular fa-clock text-gray-500 mr-1"></i>
                                <span class="text-sm font-medium">仿真时间: </span>
                                <span class="ml-1 text-sm">45.6秒</span>
                            </div>
                            <div class="mb-1">
                                <div class="text-sm font-medium mb-1">

                                </div>
                                <div class="grid grid-cols-3 gap-1 text-xs text-gray-600">
                                    <div>J1: 15°</div>
                                    <div>J2: -30°</div>
                                    <div>J3: 45°</div>
                                    <div>J4: 0°</div>
                                    <div>J5: 60°</div>
                                    <div>J6: 0°</div>
                                </div>
                            </div>
                            <div class="mb-1 flex items-center">
                                <i class="fa-solid fa-location-dot text-gray-500 mr-1"></i>
                                <span class="text-sm font-medium">TCP位置: </span>
                                <span class="ml-1 text-sm">(400, 0, 300)</span>
                            </div>
                            <div class="flex items-center">
                                <i class="fa-solid fa-ban text-gray-500 mr-1"></i>
                                <span class="text-sm font-medium">碰撞状态: </span>
                                <span class="ml-1 text-sm flex items-center">
                                    <span class="inline-block w-2 h-2 rounded-full bg-success mr-1"></span>无碰撞
                                </span>
                            </div>
                        </div>
                        <div class="flex items-center justify-center">
                            <div class="text-center">
                                <div class="w-24 h-24 mx-auto mb-2 relative">
                                    <div class="absolute inset-0 rounded-full border-4 border-gray-200"></div>
                                    <div class="absolute inset-0 rounded-full border-4 border-primary border-t-transparent" style="transform: rotate(45deg)"></div>
                                    <div class="absolute inset-0 flex items-center justify-center text-xl font-bold text-primary">
                                        86%
                                    </div>
                                </div>
                                <div class="text-sm text-gray-600">完成度</div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn-outline mr-2 text-sm">
                            <i class="fa-solid fa-table mr-1"></i>详细数据
                        </button>
                        <button class="btn-outline text-sm">

                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Right Column: Control Panel + Environment Settings -->

                <div id="control-panel" class="card h-[48%]">
                    <div class="card-header bg-success bg-opacity-10">
                        <div class="flex items-center">

                    <div class="card-body space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">🤖 仿真模型:</label>
                            <select class="select-control">

                                <option>UR5机械臂</option>
                                <option>KUKA LBR iiwa</option>
                                <option>ABB IRB 120</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-1">🎯 仿真模式:</label>

                                <div class="flex items-center">

                                <div class="flex items-center">

                                <div class="flex items-center">

                        <div>

                        <div>

                                <option>工厂</option>

                        <div>
                            <label class="block text-sm font-medium mb-1">📦 障碍物:</label>

                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="obj2" checked="" class="mr-2">
                                    <label for="obj2" class="text-sm">椅子</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="obj3" class="mr-2">
                                    <label for="obj3" class="text-sm">柜子</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="obj4" class="mr-2">
                                    <label for="obj4" class="text-sm">墙壁</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="obj5" class="mr-2">
                                    <label for="obj5" class="text-sm">显示器</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="obj6" class="mr-2">
                                    <label for="obj6" class="text-sm">键盘</label>
                                </div>
                            </div>
                            <div class="flex gap-2 mt-2">
                                <button class="btn-outline text-xs py-1 flex-1">
                                    <i class="fa-solid fa-plus mr-1"></i>添加障碍
                                </button>
                                <button class="btn-outline text-xs py-1 flex-1">
                                    <i class="fa-solid fa-trash mr-1"></i>清空
                                </button>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-1">🌍 重力设置:</label>
                            <select class="select-control">
                                <option>9.8 m/s² (地球)</option>
                                <option>1.6 m/s² (月球)</option>
                                <option>3.7 m/s² (火星)</option>
                                <option>0.0 m/s² (零重力)</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-1">🔆 光照条件:</label>
                            <div class="flex items-center">
                                <input type="range" min="0" max="100" value="70" class="slider flex-1 mr-2">
                                <span class="text-sm font-medium">70%</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn-primary mr-2">
                            <i class="fa-solid fa-check mr-1"></i>应用环境
                        </button>
                        <button class="btn-outline">
                            <i class="fa-solid fa-rotate-left mr-1"></i>重置
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // This would initialize a Three.js scene in a real implementation
        // Simplified mock implementation for demo purposes
        document.addEventListener('DOMContentLoaded', function() {
            // Mock simulation status updates
            let simulationRunning = false;
            const startBtn = document.querySelector('.btn-success');
            const pauseBtn = document.querySelector('.btn-warning');
            const stopBtn = document.querySelector('.btn-danger');
            const resetBtn = document.querySelector('.btn-outline:has(.fa-rotate)');
            
            startBtn.addEventListener('click', function() {
                simulationRunning = true;
                updateSimulationStatus();
            });
            
            pauseBtn.addEventListener('click', function() {
                simulationRunning = false;
                updateSimulationStatus();
            });
            
            stopBtn.addEventListener('click', function() {
                simulationRunning = false;
                updateSimulationStatus();
            });
            
            resetBtn.addEventListener('click', function() {
                simulationRunning = false;
                updateSimulationStatus();
            });
            
            function updateSimulationStatus() {
                const statusIndicator = startBtn.querySelector('i');
                if (simulationRunning) {
                    statusIndicator.className = 'fa-solid fa-pause mr-1';
                    startBtn.innerHTML = '<i class="fa-solid fa-pause mr-1"></i>运行中';
                } else {
                    statusIndicator.className = 'fa-solid fa-play mr-1';
                    startBtn.innerHTML = '<i class="fa-solid fa-play mr-1"></i>开始';
                }
            }
        });
    </script>
