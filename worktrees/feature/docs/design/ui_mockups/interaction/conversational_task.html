<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;500;600;700;800;900&amp;display=swap"><style>

<body class="font-sans text-secondary bg-white">
    <div id="main-content" class="w-full h-[calc(100vh-100px)] overflow-hidden flex flex-col">
        <!-- Header Section -->
        <div id="page-header" class="px-6 py-4">
            <div class="flex items-center">
                <div class="bg-primary/10 p-2 rounded-lg mr-3">
                    <i class="fa-solid fa-comments text-primary text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-secondary">智能对话任务系统</h1>
                    <p class="text-gray-600 text-sm">自然语言交互的任务理解与执行</p>
                </div>
            </div>
        </div>

        <!-- Chat Section -->
        <div id="chat-container" class="flex-1 flex flex-col p-4 gap-4 overflow-hidden">
            <!-- Chat History Area -->
            <div id="chat-history" class="flex-1 bg-chatBg rounded-xl p-4 overflow-y-auto">
                <!-- Bot Message -->
                <div id="message-1" class="mb-6">
                    <div class="flex items-start">
                        <div class="bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center mr-2 flex-shrink-0">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <div class="flex-1">
                            <div class="bg-botBubble p-3 rounded-lg rounded-tl-none mb-1">
                                <p class="text-secondary">您好！我是XC机器人助手，请问需要什么帮助？</p>
                            </div>
                            <div class="flex justify-end text-xs text-gray-500">
                                <span class="mr-2">14:30</span>
                                <button class="text-gray-400 hover:text-primary">
                                    <i class="fa-regular fa-star"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- User Message -->
                <div id="message-2" class="mb-6">
                    <div class="flex justify-end">
                        <div class="max-w-[80%]">
                            <div class="bg-userBubble p-3 rounded-lg rounded-tr-none mb-1">
                                <p class="text-secondary">请帮我控制右臂移动到桌子上方</p>
                            </div>
                            <div class="text-xs text-gray-500 text-right">14:31</div>
                        </div>
                        <div class="bg-secondary text-white rounded-full w-8 h-8 flex items-center justify-center ml-2 flex-shrink-0">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>
                </div>

                <!-- Bot Response with Task -->
                <div id="message-3" class="mb-6">
                    <div class="flex items-start">
                        <div class="bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center mr-2 flex-shrink-0">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <div class="flex-1">
                            <div class="bg-botBubble p-3 rounded-lg rounded-tl-none mb-1">
                                <p class="text-secondary mb-3">好的，我将控制右臂移动到桌子上方位置。</p>
                                <div class="border-t border-gray-200 pt-2">
                                    <div class="flex items-center text-sm mb-1">
                                        <i class="fa-solid fa-bullseye text-primary mr-2"></i>
                                        <span class="font-medium">执行任务: 机械臂移动</span>
                                    </div>
                                    <div class="flex items-center text-sm mb-1">
                                        <i class="fa-solid fa-chart-line text-warning mr-2"></i>
                                        <span>当前状态: 执行中...</span>
                                    </div>
                                    <div class="flex items-center text-sm">
                                        <i class="fa-solid fa-check-circle text-success mr-2"></i>
                                        <span>任务完成: 右臂已移动到目标位置</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex justify-end text-xs text-gray-500">
                                <span class="mr-2">14:32</span>
                                <button class="text-gray-400 hover:text-primary">
                                    <i class="fa-regular fa-star"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- User Message -->
                <div id="message-4" class="mb-6">
                    <div class="flex justify-end">
                        <div class="max-w-[80%]">
                            <div class="bg-userBubble p-3 rounded-lg rounded-tr-none mb-1">
                                <p class="text-secondary">拍一张照片</p>
                            </div>
                            <div class="text-xs text-gray-500 text-right">14:33</div>
                        </div>
                        <div class="bg-secondary text-white rounded-full w-8 h-8 flex items-center justify-center ml-2 flex-shrink-0">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>
                </div>

                <!-- Bot Response with Photo Task -->
                <div id="message-5" class="mb-6">
                    <div class="flex items-start">
                        <div class="bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center mr-2 flex-shrink-0">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <div class="flex-1">
                            <div class="bg-botBubble p-3 rounded-lg rounded-tl-none mb-1">
                                <p class="text-secondary mb-3">正在为您拍照...</p>
                                <div class="border-t border-gray-200 pt-2">
                                    <div class="flex items-center text-sm">
                                        <i class="fa-solid fa-camera text-success mr-2"></i>
                                        <span>照片已保存: photo_20250719_1433.jpg</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex justify-end text-xs text-gray-500">
                                <span class="mr-2">14:33</span>
                                <button class="text-gray-400 hover:text-primary">
                                    <i class="fa-regular fa-star"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div id="input-area" class="bg-white rounded-xl border border-gray-200 p-3">
                <div class="flex items-center">
                    <input type="text" class="flex-1 border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="请输入您的指令...">
                    <button class="ml-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-full w-10 h-10 flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button class="ml-2 bg-primary hover:bg-primary/90 text-white rounded-lg px-4 py-2 flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-paper-plane mr-1"></i>
                        发送
                    </button>
                </div>
            </div>

            <!-- Quick Commands and Status -->
            <div id="commands-status" class="grid grid-cols-5 gap-4">
                <div id="quick-commands" class="col-span-4">
                    <div class="mb-2">
                        <h3 class="text-sm font-medium flex items-center">
                            <i class="fa-solid fa-bullseye text-primary mr-1"></i>
                            快捷指令
                        </h3>
                    </div>
                    <div class="grid grid-cols-3 gap-2 md:grid-cols-6">
                        <button class="bg-gray-100 hover:bg-gray-200 text-secondary rounded-lg py-2 px-3 text-sm flex items-center justify-center transition-colors">
                            <i class="fa-solid fa-rotate-left text-primary mr-1"></i>
                            机械臂回零
                        </button>
                        <button class="bg-gray-100 hover:bg-gray-200 text-secondary rounded-lg py-2 px-3 text-sm flex items-center justify-center transition-colors">
                            <i class="fa-solid fa-camera text-primary mr-1"></i>
                            拍照保存
                        </button>
                        <button class="bg-gray-100 hover:bg-gray-200 text-secondary rounded-lg py-2 px-3 text-sm flex items-center justify-center transition-colors">
                            <i class="fa-solid fa-info-circle text-primary mr-1"></i>
                            状态查询
                        </button>
                        <button class="bg-gray-100 hover:bg-gray-200 text-secondary rounded-lg py-2 px-3 text-sm flex items-center justify-center transition-colors">
                            <i class="fa-solid fa-truck text-primary mr-1"></i>
                            底盘移动
                        </button>
                        <button class="bg-gray-100 hover:bg-gray-200 text-secondary rounded-lg py-2 px-3 text-sm flex items-center justify-center transition-colors">
                            <i class="fa-solid fa-user-check text-primary mr-1"></i>
                            人脸识别
                        </button>
                        <button class="bg-gray-100 hover:bg-gray-200 text-secondary rounded-lg py-2 px-3 text-sm flex items-center justify-center transition-colors">
                            <i class="fa-solid fa-arrows-rotate text-primary mr-1"></i>
                            系统复位
                        </button>
                    </div>
                </div>
                
                <div id="status-panel" class="col-span-1">
                    <div class="mb-2">
                        <h3 class="text-sm font-medium flex items-center">
                            <i class="fa-solid fa-chart-line text-primary mr-1"></i>
                            对话状态
                        </h3>
                    </div>
                    <div class="bg-white border border-gray-200 rounded-lg p-2">
                        <div class="flex items-center mb-1 text-sm">
                            <div class="w-3 h-3 bg-success rounded-full mr-2"></div>
                            <span>在线</span>
                        </div>
                        <div class="flex items-center mb-1 text-sm">
                            <i class="fa-solid fa-microphone text-primary mr-2 w-3"></i>
                            <span>监听中</span>
                        </div>
                        <div class="flex items-center text-sm">
                            <i class="fa-solid fa-comment-dots text-primary mr-2 w-3"></i>
                            <span>等待指令</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Voice recognition simulation
        const micButton = document.querySelector('#input-area button:first-of-type');
        const inputField = document.querySelector('#input-area input');
        let isListening = false;

        micButton.addEventListener('click', () => {
            isListening = !isListening;
            
            if (isListening) {
                micButton.classList.remove('bg-gray-100', 'hover:bg-gray-200');
                micButton.classList.add('bg-primary', 'text-white');
                inputField.placeholder = "正在听您说话...";
                
                // Simulate voice recognition after 3 seconds
                setTimeout(() => {
                    if (isListening) {
                        inputField.value = "请打开机械臂摄像头";
                        micButton.click(); // Turn off listening
                    }
                }, 3000);
            } else {
                micButton.classList.remove('bg-primary', 'text-white');
                micButton.classList.add('bg-gray-100', 'hover:bg-gray-200');
                inputField.placeholder = "请输入您的指令...";
            }
        });

        // Quick command buttons
        const quickCommandButtons = document.querySelectorAll('#quick-commands button');
        quickCommandButtons.forEach(button => {
            button.addEventListener('click', () => {
                inputField.value = button.textContent.trim();
            });
        });

        // Send message function
        const sendButton = document.querySelector('#input-area button:last-of-type');
        const chatHistory = document.querySelector('#chat-history');
        
        sendButton.addEventListener('click', () => {
            const message = inputField.value.trim();
            if (message) {
                // Add user message
                addUserMessage(message);
                
                // Clear input
                inputField.value = '';
                
                // Simulate bot response after 1 second
                setTimeout(() => {
                    addBotResponse(message);
                }, 1000);
            }
        });

        // Enter key to send message
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendButton.click();
            }
        });

        // Add user message to chat
        function addUserMessage(message) {
            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ':' + 
                         now.getMinutes().toString().padStart(2, '0');
            
            const messageHTML = `
                <div class="mb-6">
                    <div class="flex justify-end">
                        <div class="max-w-[80%]">
                            <div class="bg-userBubble p-3 rounded-lg rounded-tr-none mb-1">
                                <p class="text-secondary">${message}</p>
                            </div>
                            <div class="text-xs text-gray-500 text-right">${time}</div>
                        </div>
                        <div class="bg-secondary text-white rounded-full w-8 h-8 flex items-center justify-center ml-2 flex-shrink-0">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>
                </div>
            `;
            
            chatHistory.insertAdjacentHTML('beforeend', messageHTML);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // Add bot response to chat
        function addBotResponse(userMessage) {
            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ':' + 
                         now.getMinutes().toString().padStart(2, '0');
            
            let responseContent = '';
            
            // Generate response based on user message
            if (userMessage.includes('机械臂') || userMessage.includes('移动')) {
                responseContent = `
                    <p class="text-secondary mb-3">正在处理您的机械臂控制请求...</p>
                    <div class="border-t border-gray-200 pt-2">
                        <div class="flex items-center text-sm mb-1">
                            <i class="fa-solid fa-bullseye text-primary mr-2"></i>
                            <span class="font-medium">执行任务: 机械臂控制</span>
                        </div>
                        <div class="flex items-center text-sm mb-1">
                            <i class="fa-solid fa-chart-line text-warning mr-2"></i>
                            <span>当前状态: 执行中...</span>
                        </div>
                        <div class="flex items-center text-sm">
                            <i class="fa-solid fa-check-circle text-success mr-2"></i>
                            <span>任务完成: 机械臂已按指令移动</span>
                        </div>
                    </div>
                `;
            } else if (userMessage.includes('拍照') || userMessage.includes('照片') || userMessage.includes('摄像头')) {
                responseContent = `
                    <p class="text-secondary mb-3">正在打开摄像头准备拍照...</p>
                    <div class="border-t border-gray-200 pt-2">
                        <div class="flex items-center text-sm">
                            <i class="fa-solid fa-camera text-success mr-2"></i>
                            <span>照片已保存: photo_${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2, '0')}${now.getDate().toString().padStart(2, '0')}_${time.replace(':', '')}.jpg</span>
                        </div>
                    </div>
                `;
            } else if (userMessage.includes('状态') || userMessage.includes('查询')) {
                responseContent = `
                    <p class="text-secondary mb-3">系统状态查询结果如下：</p>
                    <div class="border-t border-gray-200 pt-2">
                        <div class="flex items-center text-sm mb-1">
                            <i class="fa-solid fa-battery-full text-success mr-2"></i>
                            <span>电池电量: 87%</span>
                        </div>
                        <div class="flex items-center text-sm mb-1">
                            <i class="fa-solid fa-wifi text-success mr-2"></i>
                            <span>网络连接: 稳定 (5G)</span>
                        </div>
                        <div class="flex items-center text-sm">
                            <i class="fa-solid fa-microchip text-success mr-2"></i>
                            <span>系统负载: 32%</span>
                        </div>
                    </div>
                `;
            } else {
                responseContent = `
                    <p class="text-secondary">我已收到您的指令"${userMessage}"，正在处理中。请问您需要进一步的帮助吗？</p>
                `;
            }
            
            const messageHTML = `
                <div class="mb-6">
                    <div class="flex items-start">
                        <div class="bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center mr-2 flex-shrink-0">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <div class="flex-1">
                            <div class="bg-botBubble p-3 rounded-lg rounded-tl-none mb-1">
                                ${responseContent}
                            </div>
                            <div class="flex justify-end text-xs text-gray-500">
                                <span class="mr-2">${time}</span>
                                <button class="text-gray-400 hover:text-primary">
                                    <i class="fa-regular fa-star"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            chatHistory.insertAdjacentHTML('beforeend', messageHTML);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>

</body></html>
